name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Dependencies
      run: |
        pip install -r backend/requirements.txt
        pip install gunicorn
    
    - name: List Files
      run: |
        ls -la
        ls -la backend/
    
    - name: Verify App Import
      run: |
        python -c "import sys; sys.path.insert(0, 'backend'); from app import app; print('✅ App imported successfully')"
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-output
        path: |
          .