# docker-compose.yml
version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=your-secret-key
      - MONGO_URI=mongodb+srv://username:password@cluster0.xxxxx.mongodb.net/ChargeEase?retryWrites=true&w=majority
      - FLASK_DEBUG=false
      - ADMIN_EMAILS=your-email@gmail.com
    volumes:
      - .:/app
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: