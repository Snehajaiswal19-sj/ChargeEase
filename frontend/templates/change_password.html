{% extends 'base.html' %}
{% block title %}Change Password | ChargeEase{% endblock %}
{% block content %}

<!-- Background Photo -->
<div style="position: fixed; inset: 0; z-index: -1; background: url('/static/images/ev-station-1.jpg') center/cover no-repeat; filter: brightness(0.3);"></div>

<div class="page-enter">

<section class="page-hero compact-hero reveal">
    <div>
        <div class="card-kicker" style="margin-bottom: 0.5rem;">SECURITY</div>
        <h1>Change <span class="gradient-text">password</span></h1>
        <p>Keep your ChargeEase account secure.</p>
    </div>
</section>

<div class="auth-card glass-card" style="max-width:480px;margin:0 auto;">
    <form method="POST" action="{{ url_for('change_password') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-field">
            <label for="current_password">Current password</label>
            <div class="input-wrap"><span>•</span><input type="password" id="current_password" name="current_password" autocomplete="current-password" required></div>
        </div>

        <div class="form-field">
            <label for="new_password">New password</label>
            <div class="input-wrap"><span>•</span><input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required></div>
        </div>

        <div class="form-field">
            <label for="confirm_password">Confirm new password</label>
            <div class="input-wrap"><span>•</span><input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required></div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Update password</button>
    </form>
</div>

</div>

{% endblock %}
