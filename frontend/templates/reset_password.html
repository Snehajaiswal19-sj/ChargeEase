<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#070b12">
    <title>Reset Password | ChargeEase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <a class="auth-brand" href="{{ url_for('home') }}">
            <span class="brand-mark">⚡</span><span>ChargeEase</span>
        </a>

        <div class="auth-card">
            <div class="auth-card-head">
                <span class="card-kicker">RESET PASSWORD</span>
                <h2>Create new password</h2>
                <p>Must be at least 8 characters.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}"><span class="flash-dot"></span><span>{{ message }}</span></div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-field">
                    <label for="new_password">New password</label>
                    <div class="input-wrap"><span>•</span><input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required></div>
                </div>
                <div class="form-field">
                    <label for="confirm_password">Confirm new password</label>
                    <div class="input-wrap"><span>•</span><input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required></div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Reset password</button>
            </form>

            <div class="auth-bottom">
                <span>Remembered it after all?</span>
                <a href="{{ url_for('login') }}">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
